<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Espiral de barro, marca da Bela Cerâmica">
  <!--
    A ESPIRAL.

    O ícone anterior era um vaso torneado ilustrado: gradiente de volume, dois
    filetes vermelhos, um ponto verde e a boca aberta com contorno. Bonito em
    512 e ilegível onde um favicon vive de fato — a 16px virava um borrão
    claro, sem forma reconhecível. Renderizei os dois lado a lado antes de
    trocar.

    A espiral é a forma das Flores de Luto, a série que a Isabela desenvolve
    agora: peças circulares de barro que se enrolam para o centro. É também o
    gesto do rolete, que é como ela constrói as esculturas. Um ícone só
    precisa de UMA forma, e esta é dela.

    OS NÚMEROS NÃO SÃO ARBITRÁRIOS. São 1,5 volta, de raio 46 a 172, com
    traço de 62. O raio cresce cerca de 90 por volta, então sobram ~28 de vão
    entre uma volta e a seguinte — pouco mais de meio pixel a 16px, que é o
    mínimo para a espiral não fundir num disco. Testei 1,25 e 1,4 volta com
    traços de 70 e 78: todas fecham o vão e viram mancha nesse tamanho.
  -->
  <rect width="512" height="512" fill="#A82F1C" />
  <path
    d="M256,210 259,209 262,209 265,208 268,208 271,208 274,208 277,209 280,210 283,210 287,211 290,213 293,214 296,216 299,218 301,220 304,222 307,225 309,228 312,230 314,234 316,237 318,240 319,244 321,247 322,251 323,255 324,259 324,263 324,268 324,272 324,276 323,281 322,285 321,289 320,293 318,298 316,302 314,306 312,310 309,314 306,317 302,321 299,324 295,327 291,330 287,333 282,335 278,338 273,340 268,341 263,343 258,344 253,344 247,345 242,345 236,345 231,344 225,343 220,342 214,340 209,338 204,336 198,334 193,331 189,327 184,324 179,320 175,315 171,311 167,306 163,301 160,296 157,290 155,284 152,278 150,272 149,266 147,260 147,253 146,246 146,240 147,233 147,226 149,220 150,213 152,206 155,200 158,193 161,187 165,181 169,175 173,169 178,164 183,159 189,154 195,149 201,145 207,141 214,138 221,135 228,132 235,130 243,128 250,127 258,126 266,125 274,125 282,126 290,127 298,128 306,130 313,133 321,136 329,139 336,143 343,148 350,152 357,158 363,163 369,169 375,176 380,183 385,190 389,197 393,205 397,213 400,222 402,230 405,239 406,248 407,257 408,266 407,275 407,284 406,294 404,303 402,312 399,321 395,330 391,338 387,347 382,355 376,363 370,370 364,378 357,384 349,391 341,397 333,402 325,408 316,412 306,416 297,420 287,423 277,425 267,427 257,428"
