<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vaso de cerâmica torneado">
  <defs>
    <!-- volume torneado: claro no centro-esquerda, sombra à direita -->
    <linearGradient id="barro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBF8F3" />
      <stop offset="0.42" stop-color="#F4F0E8" />
      <stop offset="1" stop-color="#DCD2C0" />
    </linearGradient>
    <path id="corpo" d="M256 150
      C284 150 306 152 306 165 C306 178 288 184 282 202
      C276 230 316 250 344 276 C366 296 374 316 374 328
      C374 366 352 402 320 428 C316 431 314 432 310 434
      L202 434 C198 432 196 431 192 428
      C160 402 138 366 138 328 C138 316 146 296 168 276
      C196 250 236 230 230 202 C224 184 206 178 206 165
      C206 152 228 150 256 150 Z" />
    <clipPath id="dentro"><use href="#corpo" /></clipPath>
  </defs>

  <!-- fundo vermelho full-bleed -->
  <rect width="512" height="512" fill="#A82F1C" />

  <!-- sombra de assentamento -->
  <ellipse cx="256" cy="440" rx="62" ry="9" fill="#7E2213" />

  <!-- corpo torneado -->
  <use href="#corpo" fill="url(#barro)" />

  <!-- decoração pintada à mão (dois filetes) + ponto verde -->
  <g clip-path="url(#dentro)">
    <rect x="120" y="300" width="272" height="9" fill="#A82F1C" />
    <rect x="120" y="346" width="272" height="9" fill="#A82F1C" />
    <circle cx="256" cy="327" r="15" fill="#5E7A63" />
  </g>

  <!-- boca aberta do vaso -->
  <ellipse cx="256" cy="156" rx="42" ry="9" fill="#7E2213" />
  <ellipse cx="256" cy="154" rx="42" ry="7" fill="none" stroke="#FBF8F3" stroke-width="4" />
</svg>
